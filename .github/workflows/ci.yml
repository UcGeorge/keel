# Build, vet, and run the fast test suite on every push and pull request.
# The Docker-backed engine tests and the cloud end-to-end test are skipped
# here (-short); run `make test` locally for the full suite.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (short)
        run: go test ./... -short

      - name: Check gofmt
        run: |
          out="$(gofmt -l cmd internal)"
          if [ -n "$out" ]; then
            echo "These files need gofmt:"; echo "$out"; exit 1
          fi
