{{define "content"}}
<div class="mx-auto mt-8 w-full max-w-sm">
  <div class="text-center">
    <h1 class="text-xl font-semibold tracking-tight text-slate-900">Sign in to Keel Cloud</h1>
    <p class="mt-1 text-sm text-slate-500">Deployments your whole team can run.</p>
  </div>
  <form method="post" action="/login" class="mt-8 space-y-4 rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
    {{template "csrf_field" .CSRF}}
    <input type="hidden" name="next" value="{{.Next}}">
    {{with .Error}}<div class="rounded-md bg-red-50 px-3 py-2 text-sm text-red-700">{{.}}</div>{{end}}
    <div>
      <label for="email" class="block text-sm font-medium text-slate-900">Email</label>
      <input type="email" id="email" name="email" value="{{.Email}}" required autofocus autocomplete="email"
        class="mt-1.5 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-teal-500 focus:outline-none focus:ring-1 focus:ring-teal-500">
    </div>
    <div>
      <label for="password" class="block text-sm font-medium text-slate-900">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password"
        class="mt-1.5 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-teal-500 focus:outline-none focus:ring-1 focus:ring-teal-500">
    </div>
    <button type="submit" class="w-full rounded-md bg-teal-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-teal-700">Sign in</button>
  </form>
  <p class="mt-4 text-center text-sm text-slate-500">New to Keel? <a href="/signup{{with .Next}}?next={{.}}{{end}}" class="font-medium text-teal-700 hover:text-teal-800">Create an account</a></p>
</div>
{{end}}
