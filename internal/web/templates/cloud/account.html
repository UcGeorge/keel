{{define "content"}}
<div class="mx-auto w-full max-w-2xl space-y-6">
  <h1 class="text-xl font-semibold tracking-tight text-slate-900">Account settings</h1>

  <form method="post" action="/account/profile" class="space-y-4 rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
    {{template "csrf_field" .CSRF}}
    <h2 class="text-sm font-semibold text-slate-900">Profile</h2>
    <div>
      <label for="name" class="block text-sm font-medium text-slate-900">Name</label>
      <input type="text" id="name" name="name" value="{{.Name}}" required
        class="mt-1.5 block w-full max-w-md rounded-md border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-teal-500 focus:outline-none focus:ring-1 focus:ring-teal-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-900">Email</label>
      <p class="mt-1.5 text-sm text-slate-500">{{.Email}}</p>
    </div>
    <button type="submit" class="rounded-md bg-slate-900 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-slate-800">Save profile</button>
  </form>

  <form method="post" action="/account/password" class="space-y-4 rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
    {{template "csrf_field" .CSRF}}
    <h2 class="text-sm font-semibold text-slate-900">Change password</h2>
    <div>
      <label for="current_password" class="block text-sm font-medium text-slate-900">Current password</label>
      <input type="password" id="current_password" name="current_password" required autocomplete="current-password"
        class="mt-1.5 block w-full max-w-md rounded-md border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-teal-500 focus:outline-none focus:ring-1 focus:ring-teal-500">
    </div>
    <div>
      <label for="new_password" class="block text-sm font-medium text-slate-900">New password</label>
      <input type="password" id="new_password" name="new_password" required minlength="10" autocomplete="new-password"
        class="mt-1.5 block w-full max-w-md rounded-md border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-teal-500 focus:outline-none focus:ring-1 focus:ring-teal-500">
      <p class="mt-1 text-xs text-slate-400">At least 10 characters. Changing your password signs out your other sessions.</p>
    </div>
    <button type="submit" class="rounded-md bg-slate-900 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-slate-800">Change password</button>
  </form>
</div>
{{end}}
