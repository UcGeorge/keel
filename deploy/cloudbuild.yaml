# Remote build of the keel-cloud image (used by keel.yaml's "Build" step).
# Runs on Cloud Build because Keel deployment steps execute inside a
# container without a Docker daemon of their own.
steps:
  - name: gcr.io/cloud-builders/docker
    # BuildKit, not the legacy builder: the Dockerfile's
    # `FROM --platform=$BUILDPLATFORM` and the TARGETOS/TARGETARCH build args
    # are BuildKit features. The legacy builder leaves them empty and fails
    # with `failed to parse platform : "" is an invalid component`.
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --tag
      - ${_IMAGE}
      - --build-arg
      - VERSION=${_VERSION}
      - .
images:
  - ${_IMAGE}
substitutions:
  _IMAGE: ""
  _VERSION: dev
options:
  logging: CLOUD_LOGGING_ONLY
