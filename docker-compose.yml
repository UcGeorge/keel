# Local / single-host deployment of Keel Cloud.
#
#   docker compose up --build
#
# Then open http://localhost:8080 and create the first account.
# Deployment runs execute on this host's Docker daemon via the mounted
# socket. Set KEEL_ENCRYPTION_KEY (64 hex chars) and KEEL_BASE_URL for
# anything beyond local evaluation — see .env.example.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: keel
      POSTGRES_PASSWORD: keel
      POSTGRES_DB: keel
    volumes:
      - keel-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keel"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"

  keel-cloud:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      KEEL_DATABASE_URL: postgres://keel:keel@db:5432/keel?sslmode=disable
      KEEL_BASE_URL: ${KEEL_BASE_URL:-http://localhost:8080}
      KEEL_ENCRYPTION_KEY: ${KEEL_ENCRYPTION_KEY:-}
      KEEL_GITHUB_APP_ID: ${KEEL_GITHUB_APP_ID:-}
      KEEL_GITHUB_APP_SLUG: ${KEEL_GITHUB_APP_SLUG:-}
      KEEL_GITHUB_PRIVATE_KEY: ${KEEL_GITHUB_PRIVATE_KEY:-}
      KEEL_GITHUB_WEBHOOK_SECRET: ${KEEL_GITHUB_WEBHOOK_SECRET:-}
    volumes:
      - keel-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"

volumes:
  keel-db:
  keel-data:
